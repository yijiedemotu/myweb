# ==============================================================================
#  反向代理片段（可选方案）
#  文件位置：/www/server/panel/vhost/nginx/proxy/cvetryu.cn/next3000.conf
#  宝塔入口：网站 → cvetryu.cn → 设置 → 反向代理 → next3000 → 配置文件
#
#  用途：如果你想让宝塔的「反向代理」界面继续管理代理规则，就用这份；
#        此时站点配置文件里必须有这一行（在 server{} 块内）：
#            include /www/server/panel/vhost/nginx/proxy/cvetryu.cn/*.conf;
#
#  注意：本文件是被 include 进 server{} 的，只允许出现 location 块，
#        不能写 server{}；map 指令也不能放这里（需要的话放到站点主配置顶部）。
#        因此这里 Connection 直接写死 "upgrade"，不引用 $connection_upgrade。
# ==============================================================================

location / {
    proxy_pass http://127.0.0.1:3000;
    proxy_http_version 1.1;

    proxy_set_header Host              $host;
    proxy_set_header X-Real-IP         $remote_addr;
    proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-Host  $host;
    proxy_set_header X-Forwarded-Port  $server_port;

    proxy_set_header Upgrade    $http_upgrade;
    proxy_set_header Connection "upgrade";

    proxy_connect_timeout 60s;
    proxy_send_timeout    300s;
    proxy_read_timeout    300s;

    proxy_buffering off;
    proxy_cache_bypass $http_upgrade;
}
