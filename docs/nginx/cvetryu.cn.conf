# ==============================================================================
#  cvetryu.cn 站点配置 —— Next.js(127.0.0.1:3000) 反向代理 + Let's Encrypt HTTPS
#  文件位置：/www/server/panel/vhost/nginx/cvetryu.cn.conf
#  宝塔入口：网站 → cvetryu.cn → 设置 → 配置文件
#  生效方式：nginx -t && nginx -s reload
#  适用：阿里云 <SERVER_IP> / 宝塔面板 / 项目已构建并用 PM2 跑在 3000
# ==============================================================================

# WebSocket / SSE 透传用的变量映射。
# map 必须位于 http{} 上下文；宝塔是把 vhost/*.conf 在 http{} 里 include 的，
# 所以写在这个文件顶部是合法的。
# 若 nginx -t 报 "duplicate map"（说明别的站点也定义过），删掉本段，
# 并把下面所有 `$connection_upgrade` 改成 "upgrade"。
map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

# ------------------------------------------------------------------------------
# HTTP :80 —— 只保留 ACME 证书验证，其余 301 跳 HTTPS
# 注意：证书没有申请成功之前，请把下面整个 443 段先注释掉，否则 nginx -t 会
#      报 "cannot load certificate ... fullchain.pem"。
# ------------------------------------------------------------------------------
server {
    listen 80;
    server_name cvetryu.cn www.cvetryu.cn;

    access_log /www/wwwlogs/cvetryu.cn.log;
    error_log  /www/wwwlogs/cvetryu.cn.error.log;

    # Let's Encrypt 文件验证目录：必须允许明文 HTTP 访问，否则申请/续签会失败
    location ^~ /.well-known/acme-challenge/ {
        root /www/wwwroot/cvetryu.cn;
        default_type "text/plain";
        allow all;
    }

    # 其余请求一律跳 HTTPS（跳转写在 location 内，才不会抢在 ACME 之前执行）
    location / {
        return 301 https://$host$request_uri;
    }
}

# ------------------------------------------------------------------------------
# HTTPS :443 —— 反代到本机 3000
# ------------------------------------------------------------------------------
server {
    listen 443 ssl http2;
    # 若你的 nginx 是 1.25.1 及以上版本，上面这行会提示 http2 参数已废弃，
    # 可改成两行： listen 443 ssl;   +   http2 on;
    server_name cvetryu.cn www.cvetryu.cn;

    # ------------------------------ 证书 ------------------------------
    # 宝塔申请 Let's Encrypt 后自动生成到这两个路径；用「其他证书」粘贴的
    # 商业证书同样是这两个文件名。
    ssl_certificate     /www/server/panel/vhost/cert/cvetryu.cn/fullchain.pem;
    ssl_certificate_key /www/server/panel/vhost/cert/cvetryu.cn/privkey.pem;

    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers ECDHE-RSA-AES128-GCM-SHA256:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-RSA-CHACHA20-POLY1305:ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:DHE-RSA-AES128-GCM-SHA256:DHE-RSA-AES256-GCM-SHA384;
    ssl_prefer_server_ciphers on;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 10m;
    ssl_stapling on;
    ssl_stapling_verify on;

    # 用 http:// 误访问到 443 端口时的兜底跳转
    error_page 497 https://$host$request_uri;

    # ------------------------------ 日志 ------------------------------
    access_log /www/wwwlogs/cvetryu.cn.log;
    error_log  /www/wwwlogs/cvetryu.cn.error.log;

    # 请求体上限：后台上传图片、发长文需要，太小会 413
    client_max_body_size 100m;

    # ---------------------------- 安全响应头 ----------------------------
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options SAMEORIGIN always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    # 确认所有子域都上 HTTPS 后再启用 HSTS：
    # add_header Strict-Transport-Security "max-age=31536000" always;

    # ============================== 反代核心 ==============================
    # 刻意不写 *.js / *.css / 图片 的 location 正则：
    # 宝塔默认模板里那两条会把 /_next/static/** 当成本地文件去找 → 404 → 白屏。
    # Next.js 自己已经给静态资源设了长缓存头，nginx 不需要再管。
    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;

        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host  $host;
        proxy_set_header X-Forwarded-Port  $server_port;

        # WebSocket(HMR 等) 升级
        proxy_set_header Upgrade    $http_upgrade;
        proxy_set_header Connection $connection_upgrade;

        proxy_connect_timeout 60s;
        proxy_send_timeout    300s;
        proxy_read_timeout    300s;

        # Next.js 的 RSC / 流式渲染需要关闭缓冲，否则首屏要等整页渲染完
        proxy_buffering off;
        proxy_cache_bypass $http_upgrade;
    }
    # =====================================================================

    # ------------------ 可选：后台只允许指定 IP 访问 ------------------
    # 家宽 IP 会变的话不要开，否则自己也会被挡在外面。
    # location ^~ /admin {
    #     allow 1.2.3.4;          # 换成你的公网 IP
    #     deny all;
    #
    #     proxy_pass http://127.0.0.1:3000;
    #     proxy_http_version 1.1;
    #     proxy_set_header Host              $host;
    #     proxy_set_header X-Real-IP         $remote_addr;
    #     proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
    #     proxy_set_header X-Forwarded-Proto $scheme;
    #     proxy_set_header Upgrade           $http_upgrade;
    #     proxy_set_header Connection        $connection_upgrade;
    # }

    # 禁止访问隐藏文件（.well-known 除外）
    location ~ /\.(?!well-known).* {
        deny all;
    }
}
