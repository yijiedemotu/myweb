# ==============================================================================
#  宝塔面板 nginx 全局主配置（对应 /www/server/nginx/conf/nginx.conf）
#
#  ⚠️ 说明：这是**参考副本 / 可选改动版**，不是必须覆盖的文件。
#     本站点（cvetryu.cn）的域名反代 + HTTPS 全部写在站点配置里：
#         /www/server/panel/vhost/nginx/cvetryu.cn.conf   （见同目录 cvetryu.cn.conf）
#     全局配置只在下面标注「可选改动」的两处做了调整，其余与服务器现状一致。
#
#  覆盖前务必备份：
#      cp /www/server/nginx/conf/nginx.conf /www/server/nginx/conf/nginx.conf.bak-$(date +%F)
#  生效前必须检查语法：
#      nginx -t && nginx -s reload
# ==============================================================================

user  www www;
worker_processes auto;
error_log  /www/wwwlogs/nginx_error.log  crit;
pid        /www/server/nginx/logs/nginx.pid;
worker_rlimit_nofile 51200;

stream {
    log_format tcp_format '$time_local|$remote_addr|$protocol|$status|$bytes_sent|$bytes_received|$session_time|$upstream_addr|$upstream_bytes_sent|$upstream_bytes_received|$upstream_connect_time';

    access_log /www/wwwlogs/tcp-access.log tcp_format;
    error_log /www/wwwlogs/tcp-error.log;
    include /www/server/panel/vhost/nginx/tcp/*.conf;
}

events
    {
        use epoll;
        worker_connections 51200;
        multi_accept on;
    }

http
    {
        include       mime.types;
        #include luawaf.conf;

        include proxy.conf;
        lua_package_path "/www/server/nginx/lib/lua/?.lua;;";

        default_type  application/octet-stream;

        server_names_hash_bucket_size 512;
        client_header_buffer_size 32k;
        large_client_header_buffers 4 32k;

        # ---- 可选改动 1：全局请求体上限 50m → 100m ----
        # 站点里若另写了 client_max_body_size，以站点配置为准（location > server > http）
        client_max_body_size 100m;

        sendfile   on;
        tcp_nopush on;

        keepalive_timeout 60;

        tcp_nodelay on;

        fastcgi_connect_timeout 300;
        fastcgi_send_timeout 300;
        fastcgi_read_timeout 300;
        fastcgi_buffer_size 64k;
        fastcgi_buffers 4 64k;
        fastcgi_busy_buffers_size 128k;
        fastcgi_temp_file_write_size 256k;
        fastcgi_intercept_errors on;

        gzip on;
        gzip_min_length  1k;
        gzip_buffers     4 16k;
        gzip_http_version 1.1;
        gzip_comp_level 5;
        # ---- 可选改动 2：末尾补 application/wasm ----
        gzip_types     text/plain application/javascript application/x-javascript text/javascript text/css application/xml application/json image/jpeg image/gif image/png font/ttf font/otf image/svg+xml application/xml+rss text/x-js application/wasm;
        gzip_vary on;
        gzip_proxied   expired no-cache no-store private auth;
        gzip_disable   "MSIE [1-6]\.";

        limit_conn_zone $binary_remote_addr zone=perip:10m;
        limit_conn_zone $server_name zone=perserver:10m;

        server_tokens off;
        access_log off;

server
    {
        listen 888;
        server_name phpmyadmin;
        index index.html index.htm index.php;
        root  /www/server/phpmyadmin;

        #error_page   404   /404.html;
        include enable-php.conf;

        location ~ .*\.(gif|jpg|jpeg|png|bmp|swf)$
        {
            expires      30d;
        }

        location ~ .*\.(js|css)?$
        {
            expires      12h;
        }

        location ~ /\.
        {
            deny all;
        }

        access_log  /www/wwwlogs/access.log;
    }

        # ⚠️ 这一行必须留在 http{} 内部：站点配置（cvetryu.cn.conf，含 map 指令）由它加载。
        # 若移到 http{} 外面，nginx 会报 "server directive is not allowed here" 无法启动。
        include /www/server/panel/vhost/nginx/*.conf;
}
